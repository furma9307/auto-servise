<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Калькулятор стоимости — TurboDrive</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="dark-theme">

  <header class="header">
    <div class="container header__container">
      <a href="index.html" class="logo">TURBO<span>DRIVE</span></a>
      <nav class="nav" id="nav">
        <ul class="nav__list">
          <li><a href="index.html" class="nav__link">Главная</a></li>
          <li><a href="services.html" class="nav__link">Услуги</a></li>
          <li><a href="calculator.html" class="nav__link nav__link--active">Калькулятор</a></li>
          <li><a href="contacts.html" class="nav__link">Контакты</a></li>
        </ul>
      </nav>
      <a href="calculator.html" class="btn btn--neon header__btn">Онлайн-расчет</a>
      <button class="burger" id="burgerBtn">
        <span></span><span></span><span></span>
      </button>
    </div>
  </header>

  <main>
    <section class="page-header">
      <div class="container">
        <h1 class="page-title">Калькулятор услуг</h1>
        <p class="page-subtitle">Отметьте необходимые работы для расчета ориентировочной стоимости</p>
      </div>
    </section>

    <section class="calc-section">
      <div class="container calc__container">
        <div class="calc__form">
          <h3>Выберите позиции:</h3>
          <label class="calc__label">
            <input type="checkbox" class="calc-checkbox" value="1500"> Компьютерная диагностика (1 500 ₽)
          </label>
          <label class="calc__label">
            <input type="checkbox" class="calc-checkbox" value="2000"> Шиномонтаж (2 000 ₽)
          </label>
          <label class="calc__label">
            <input type="checkbox" class="calc-checkbox" value="1800"> Ремонт тормозной системы (1 800 ₽)
          </label>
          <label class="calc__label">
            <input type="checkbox" class="calc-checkbox" value="800"> Замена масла (800 ₽)
          </label>
        </div>

        <div class="calc__result">
          <h3>Итого к оплате:</h3>
          <div class="calc__total" id="totalPrice">0 ₽</div>
          <button class="btn btn--neon" id="orderBtn" style="width: 100%;">Записаться в сервис</button>
        </div>
      </div>
    </section>
  </main>

  <script src="js/script.js"></script>
</body>
</html>
