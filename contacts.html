<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Контакты — TurboDrive</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="dark-theme">

  <header class="header">
    <div class="container header__container">
      <a href="index.html" class="logo">TURBO<span>DRIVE</span></a>
      <nav class="nav" id="nav">
        <ul class="nav__list">
          <li><a href="index.html" class="nav__link">Главная</a></li>
          <li><a href="services.html" class="nav__link">Услуги</a></li>
          <li><a href="calculator.html" class="nav__link">Калькулятор</a></li>
          <li><a href="contacts.html" class="nav__link nav__link--active">Контакты</a></li>
        </ul>
      </nav>
      <a href="calculator.html" class="btn btn--neon header__btn">Онлайн-расчет</a>
      <button class="burger" id="burgerBtn">
        <span></span><span></span><span></span>
      </button>
    </div>
  </header>

  <main>
    <section class="page-header">
      <div class="container">
        <h1 class="page-title">Контакты</h1>
        <p class="page-subtitle">Ждем вас ежедневно с 9:00 до 21:00</p>
      </div>
    </section>

    <section class="contacts-section">
      <div class="container contacts__container">
        <div class="contacts__info">
          <h3>Наш автоцентр</h3>
          <p><strong>Адрес:</strong> г. Москва, Автомобильный проезд, д. 8</p>
          <p><strong>Телефон:</strong> +7 (495) 555-35-35</p>
          <p><strong>Email:</strong> service@turbodrive.ru</p>
        </div>
        
        <div class="contacts__form-card">
          <h3>Заказать обратный звонок</h3>
          <form class="form" id="contactForm">
            <input type="text" class="form__input" placeholder="Ваше имя" required>
            <input type="tel" class="form__input" placeholder="Номер телефона" required>
            <button type="submit" class="btn btn--neon" style="width: 100%;">Отправить заявку</button>
          </form>
        </div>
      </div>
    </section>
  </main>

  <script src="js/script.js"></script>
</body>
</html>
